const FS=`precision highp float;varying vec3 vn;varying vec3 vp;
uniform vec3 col;uniform float cut;uniform float cutOn;
void main(){
  if(cutOn>0.5 && vp.y<cut) discard;

  vec3 L1=normalize(vec3(-0.45,-0.75,0.65));
  vec3 L2=normalize(vec3(0.7,0.35,0.25));
  float d=max(dot(N,L1),0.0)*0.85+max(dot(N,L2),0.0)*0.3;
  float amb=0.34+0.16*(N.z*0.5+0.5);
  vec3 c=col*(amb+d);
  float f=pow(1.0-max(dot(N,vec3(0.0,0.0,1.0)),0.0),3.0);
  c+=vec3(0.05)*f;

const cv=document.getElementById("c");

function M(a,b){const o=new Float32Array(16);

  // renders nothing. toDataURL returning the six characters "data:," is the tell.
  const dpr=Math.min(devicePixelRatio||1,2);

(function retry(n){if(pending&&n>0){draw();setTimeout(()=>retry(n-1),250);}})(20);
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",draw);
function tog(id,fn){const b=document.getElementById(id);
  b.onclick=()=>{const v=b.getAttribute("aria-pressed")!=="true";
    b.setAttribute("aria-pressed",v);fn(v);draw();};}
tog("bring",v=>show.ring=v?1:0);
tog("bthe",v=>{show.thermos=v?1:0;show.thermos_neck=v?1:0;show.thermos_liner=v?1:0;});
tog("bdrip",v=>show.dripper=v?1:0);
tog("bcut",v=>{cutOn=v?1:0;cut=0;});
// Redraw when the page becomes visible again or finishes loading fonts, so a restored tab is
// never showing an empty canvas.
addEventListener("load",draw);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)draw();});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
