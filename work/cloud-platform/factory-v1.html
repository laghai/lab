<title>Cloud Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#f4f6f8; --card:#fff; --ink:#15212c; --muted:#5b6a78; --rule:#d2dae1; --axis:#aab6c1;
    --live:#12708c; --gold:#c0761c; --gpu:#7a4fa3; --dead:#b3441e; --quiet:#7d8a96;
    --shadow:0 1px 2px rgba(21,33,44,.06), 0 8px 24px rgba(21,33,44,.05);
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --paper:#0d151d; --card:#131e28; --ink:#e3ebf2; --muted:#93a5b5; --rule:#25333f; --axis:#3d4d5c;
    --live:#4fb6d6; --gold:#e2984c; --gpu:#b18ad6; --dead:#e2683c; --quiet:#8496a4;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);}}
  :root[data-theme="dark"]{
    --paper:#0d151d; --card:#131e28; --ink:#e3ebf2; --muted:#93a5b5; --rule:#25333f; --axis:#3d4d5c;
    --live:#4fb6d6; --gold:#e2984c; --gpu:#b18ad6; --dead:#e2683c; --quiet:#8496a4;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);}
  *{box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;
    font-size:18px;line-height:1.55;margin:0;padding:clamp(1.2rem,3vw,2.4rem) 1.1rem 3rem;-webkit-font-smoothing:antialiased}
  .wrap{max-width:46rem;margin:0 auto;display:flex;flex-direction:column;gap:1.5rem}
  h1{font-size:clamp(1.7rem,4.5vw,2.2rem);line-height:1.1;font-weight:600;margin:0;letter-spacing:-.015em}
  .stamp{font-family:"IBM Plex Mono",monospace;font-size:.78rem;color:var(--muted);margin:.35rem 0 0}
  .chip.billed{border-color:var(--live);color:var(--live)}
  .chip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.66rem;
    border:1px solid var(--rule);border-radius:2px;padding:.06rem .34rem;margin-left:.3rem;color:var(--muted)}
  figure{margin:0;background:var(--card);border:1px solid var(--rule);border-radius:2px;
    padding:1rem .9rem .75rem;box-shadow:var(--shadow);overflow-x:auto}
  figure svg{display:block;width:100%;max-width:100%;height:auto;color:var(--ink)}
  .figtitle{font-size:1rem;font-weight:600;line-height:1.3;margin:0 0 .7rem;letter-spacing:-.005em}
  figcaption{font-family:"IBM Plex Mono",monospace;font-size:.71rem;line-height:1.5;
    color:var(--muted);margin-top:.7rem;padding-top:.55rem;border-top:1px solid var(--rule)}
</style>

<div class="wrap">
  <div>
    <h1>Cloud factory</h1>
    <p class="stamp">read Sun 23 Aug, 23:00 &#183; the total is <span class="chip billed">billed</span> by Google &#183; per-mission is <span class="chip">derived</span> from Google's own meter &#215; catalog rate</p>
  </div>

  <figure>
    <p class="figtitle">August, so far &#8212; you are underspending</p>
    <svg viewBox="0 0 660 172" role="img" aria-label="Google has billed 34.72 dollars of a 300 dollar August budget, 12 percent, and the month is projected to end near 89 dollars, under a third of budget. The spend is not the constraint.">
      <text x="14" y="22" font-family="IBM Plex Mono, monospace" font-size="15" fill="currentColor" opacity=".7">BILLED SO FAR</text>
      <text x="646" y="22" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="15" fill="currentColor" opacity=".7">BUDGET $300</text>

      <rect x="14" y="34" width="632" height="42" rx="2" fill="none" stroke="var(--rule)" stroke-width="1.5"/>
      <rect x="14" y="34" width="73" height="42" fill="var(--live)" opacity=".9"/>
      <rect x="87" y="34" width="114" height="42" fill="var(--live)" opacity=".22"/>

      <line x1="87" y1="28" x2="87" y2="94" stroke="currentColor" stroke-width="2"/>
      <text x="95" y="110" font-family="IBM Plex Mono, monospace" font-size="18" fill="currentColor" font-weight="500">$34.72 &#183; 12%</text>

      <line x1="201" y1="40" x2="201" y2="88" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 3"/>
      <text x="209" y="62" font-family="IBM Plex Mono, monospace" font-size="15" fill="currentColor" opacity=".65">on pace for $89 &#183; 30%</text>

      <text x="95" y="132" font-family="IBM Plex Mono, monospace" font-size="15" fill="currentColor" opacity=".65">about 5 minutes of your time</text>

      <line x1="14" y1="146" x2="646" y2="146" stroke="var(--rule)" stroke-width="1"/>
      <text x="14" y="166" font-family="IBM Plex Mono, monospace" font-size="16" fill="var(--gold)" font-weight="500">Spend is not the constraint here.</text>
    </svg>
    <figcaption>Google&#8217;s own month-to-date figure, read from the billing pipeline. The $300 budget has never been close to binding.</figcaption>
  </figure>

  <figure>
    <p class="figtitle">What the cloud did for each mission</p>
    <svg viewBox="0 0 660 316" role="img" aria-label="Coffee optics cost 15.43 dollars for 506 renders and is idle. Cabin cost 8.16 and delivered 864 viewpoint calculations, finished. Voice intake 3.52 for 116 recordings and is running. The Entity 1.01 for 82 frames. CITYarts 93 cents for 8 live site variants.">
      <g font-family="IBM Plex Mono, monospace">
        <text x="14" y="20" font-size="15" fill="currentColor" opacity=".7">SPEND</text>
        <text x="350" y="20" font-size="15" fill="currentColor" opacity=".7">WHAT IT BOUGHT</text>

        <text x="14" y="48" font-size="16" fill="currentColor" font-weight="500">coffee</text>
        <rect x="110" y="34" width="176" height="20" fill="var(--gold)" opacity=".85"/>
        <text x="334" y="49" text-anchor="end" font-size="16" fill="currentColor" font-weight="500">$15.43</text>
        <text x="350" y="43" font-size="15" fill="currentColor">506 renders, 17 runs</text>
        <rect x="350" y="54" width="90" height="19" rx="9" fill="none" stroke="var(--quiet)" stroke-width="1.4"/>
        <text x="395" y="68" text-anchor="middle" font-size="12" fill="var(--quiet)">idle 2 days</text>

        <text x="14" y="108" font-size="16" fill="currentColor" font-weight="500">cabin</text>
        <rect x="110" y="94" width="93" height="20" fill="var(--dead)" opacity=".85"/>
        <text x="334" y="109" text-anchor="end" font-size="16" fill="currentColor" font-weight="500">$8.16</text>
        <text x="350" y="103" font-size="15" fill="currentColor">864 viewpoints computed</text>
        <text x="350" y="123" font-size="14" fill="currentColor" opacity=".7">54% ok &#183; 36% marginal &#183; 10% washed</text>
        <rect x="350" y="132" width="90" height="19" rx="9" fill="var(--live)"/>
        <text x="395" y="146" text-anchor="middle" font-size="12" fill="#fff" font-weight="500">FINISHED</text>

        <text x="14" y="186" font-size="16" fill="currentColor" font-weight="500">intake</text>
        <rect x="110" y="172" width="40" height="20" fill="var(--live)" opacity=".9"/>
        <text x="334" y="187" text-anchor="end" font-size="16" fill="currentColor" font-weight="500">$3.52</text>
        <text x="350" y="181" font-size="15" fill="currentColor">116 recordings transcribed</text>
        <text x="350" y="201" font-size="14" fill="currentColor" opacity=".7">incl. the 23-min strategy memo</text>
        <rect x="350" y="210" width="90" height="19" rx="9" fill="var(--live)"/>
        <text x="395" y="224" text-anchor="middle" font-size="12" fill="#fff" font-weight="500">RUNNING</text>

        <line x1="14" y1="248" x2="646" y2="248" stroke="var(--rule)" stroke-width="1"/>
        <text x="14" y="272" font-size="15" fill="currentColor" opacity=".7">UNDER A DOLLAR FIFTY</text>

        <text x="14" y="298" font-size="16" fill="currentColor">Entity</text>
        <text x="140" y="298" text-anchor="end" font-size="16" fill="currentColor" opacity=".75">$1.01</text>
        <text x="156" y="298" font-size="15" fill="currentColor">82 frames</text>
        <text x="330" y="298" font-size="16" fill="currentColor">CITYarts</text>
        <text x="470" y="298" text-anchor="end" font-size="16" fill="currentColor" opacity=".75">$0.93</text>
        <text x="486" y="298" font-size="15" fill="currentColor">8 sites live</text>
      </g>
    </svg>
    <figcaption>Every mission this month cost less than a restaurant lunch. 864 ray-traced viewpoints came to $8.16.</figcaption>
  </figure>

  <figure>
    <p class="figtitle">Spend per day</p>
    <svg viewBox="0 0 660 190" role="img" aria-label="Daily spend: 11.47 Thursday, 2.09 Friday, 10.60 Saturday, 4.54 Sunday. Four working days, under 12 dollars each.">
      <line x1="60" y1="140" x2="640" y2="140" stroke="var(--axis)" stroke-width="1.4"/>
      <g font-family="IBM Plex Mono, monospace" font-size="15" fill="currentColor">
        <rect x="90"  y="20"  width="94" height="120" fill="var(--gold)" opacity=".85"/>
        <text x="137" y="14"  text-anchor="middle" font-size="17" font-weight="500">$11.47</text>
        <text x="137" y="160" text-anchor="middle" opacity=".7">Thu</text>

        <rect x="228" y="118" width="94" height="22" fill="var(--axis)"/>
        <text x="275" y="112" text-anchor="middle">$2.09</text>
        <text x="275" y="160" text-anchor="middle" opacity=".7">Fri</text>

        <rect x="366" y="29" width="94" height="111" fill="var(--gold)" opacity=".85"/>
        <text x="413" y="23" text-anchor="middle" font-size="17" font-weight="500">$10.60</text>
        <text x="413" y="160" text-anchor="middle" opacity=".7">Sat</text>

        <rect x="504" y="93" width="94" height="47" fill="var(--live)" opacity=".85"/>
        <text x="551" y="87" text-anchor="middle">$4.54</text>
        <text x="551" y="160" text-anchor="middle" opacity=".7">Sun</text>
      </g>
      <text x="640" y="182" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="15" fill="currentColor" opacity=".7">four working days, none over $12</text>
    </svg>
    <figcaption>Measured by Google&#8217;s meter, not by my stopwatch. My own first estimate of these four days was $197 &#8212; seven times too high.</figcaption>
  </figure>

  <figure>
    <p class="figtitle">The three provinces</p>
    <svg viewBox="0 0 660 152" role="img" aria-label="GCP is running with 16 jobs, 8 services, one VM and 13.6 GB. Azure is idle but configured with a T4 GPU profile and 200 dollars of credit. AWS credentials have expired; nothing runs and 200 dollars of credit is untouched.">
      <rect x="10" y="26" width="205" height="96" rx="3" fill="var(--live)" opacity=".9"/>
      <text x="112" y="20" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" fill="var(--live)" font-weight="500">GCP</text>
      <g font-family="IBM Plex Mono, monospace" font-size="14" fill="#fff" text-anchor="middle">
        <text x="112" y="54" font-size="16" font-weight="500">running</text>
        <text x="112" y="78">16 jobs &#183; 8 services</text>
        <text x="112" y="98">1 VM &#183; 13.6 GB</text>
      </g>
      <text x="112" y="142" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" fill="currentColor">$34.72 billed</text>

      <rect x="228" y="26" width="205" height="96" rx="3" fill="none" stroke="var(--gpu)" stroke-width="2.4"/>
      <text x="330" y="20" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" fill="var(--gpu)" font-weight="500">AZURE</text>
      <g font-family="IBM Plex Mono, monospace" font-size="14" fill="currentColor" text-anchor="middle">
        <text x="330" y="54" font-size="16" fill="var(--gpu)" font-weight="500">idle</text>
        <text x="330" y="78" opacity=".75">T4 GPU configured</text>
        <text x="330" y="98" opacity=".75">nothing running</text>
      </g>
      <text x="330" y="142" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" fill="currentColor">$200 credit</text>

      <rect x="446" y="26" width="205" height="96" rx="3" fill="none" stroke="var(--dead)" stroke-width="2.4" stroke-dasharray="7 5"/>
      <text x="548" y="20" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" fill="var(--dead)" font-weight="500">AWS</text>
      <g font-family="IBM Plex Mono, monospace" font-size="14" fill="currentColor" text-anchor="middle">
        <text x="548" y="54" font-size="16" fill="var(--dead)" font-weight="500">expired</text>
        <text x="548" y="78" opacity=".75">session timed out</text>
        <text x="548" y="98" opacity=".75">nothing running</text>
      </g>
      <text x="548" y="142" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" fill="currentColor">$200 credit</text>

    </svg>
    <figcaption>$400 of credit sits unspent while the paying cloud is 69% through its budget &#8212; and AWS is unreachable only because a session token expired.</figcaption>
  </figure>

  <figure>
    <p class="figtitle">The meter costs more than the work</p>
    <svg viewBox="0 0 660 150" role="img" aria-label="brain-01 costs 96 dollars a month and has been up 53 hours. Three CITYarts production services with a minimum instance cost 20 dollars a month. Storage costs 27 cents. Together 117 dollars a month runs whether or not anyone uses it.">
      <g font-family="IBM Plex Mono, monospace">
        <text x="14" y="30" font-size="16" fill="currentColor" font-weight="500">brain-01</text>
        <rect x="180" y="16" width="380" height="20" fill="var(--gold)" opacity=".85"/>
        <text x="572" y="31" font-size="16" fill="currentColor" font-weight="500">$96</text>
        <text x="180" y="52" font-size="13" fill="currentColor" opacity=".6">e2-standard-4 &#183; up 53 h &#183; never idles</text>

        <text x="14" y="86" font-size="16" fill="currentColor" font-weight="500">cityarts-prod</text>
        <rect x="180" y="72" width="80" height="20" fill="var(--gold)" opacity=".6"/>
        <text x="272" y="87" font-size="16" fill="currentColor" font-weight="500">$20</text>
        <text x="180" y="108" font-size="13" fill="currentColor" opacity=".6">a, b, c &#183; minScale=1 &#183; billed with zero traffic</text>

        <line x1="14" y1="124" x2="646" y2="124" stroke="var(--rule)" stroke-width="1"/>
        <text x="14" y="144" font-size="16" fill="currentColor">storage $0.27</text>
        <text x="646" y="144" text-anchor="end" font-size="17" fill="var(--gold)" font-weight="500">$117 / month</text>
      </g>
    </svg>
    <figcaption>At the current pace all the computing will cost about $89 this month. The idle VM alone would cost $96. It is the one line worth a decision.</figcaption>
  </figure>
</div>
