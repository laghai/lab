<title>Cloud Infrastructure Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#E7EBEC;
  --panel:#FBFCFC;
  --panel2:#F1F4F5;
  --ink:#0F1618;
  --ink2:#3E4C52;
  --muted:#7A868C;
  --hair:#C3CCD0;
  --hair2:#D9E0E3;
  --live:#0C8A69;
  --live-fill:rgba(12,138,105,.09);
  --live-fill2:rgba(12,138,105,.20);
  --warn:#A96C0B;
  --warn-fill:rgba(169,108,11,.07);
  --bad:#B93E2C;
  --bad-fill:rgba(185,62,44,.10);
  --ghost:#9AA6AC;
  --shadow:0 1px 2px rgba(16,28,34,.06),0 8px 24px rgba(16,28,34,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B1114;
    --panel:#141C21;
    --panel2:#182229;
    --ink:#E3EAED;
    --ink2:#AFBCC3;
    --muted:#7E8C93;
    --hair:#2A363D;
    --hair2:#222D34;
    --live:#2FC79B;
    --live-fill:rgba(47,199,155,.11);
    --live-fill2:rgba(47,199,155,.24);
    --warn:#E0A33E;
    --warn-fill:rgba(224,163,62,.09);
    --bad:#F0705A;
    --bad-fill:rgba(240,112,90,.13);
    --ghost:#5C6971;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.32);
  }
}
:root[data-theme="dark"]{
  --ground:#0B1114;
  --panel:#141C21;
  --panel2:#182229;
  --ink:#E3EAED;
  --ink2:#AFBCC3;
  --muted:#7E8C93;
  --hair:#2A363D;
  --hair2:#222D34;
  --live:#2FC79B;
  --live-fill:rgba(47,199,155,.11);
  --live-fill2:rgba(47,199,155,.24);
  --warn:#E0A33E;
  --warn-fill:rgba(224,163,62,.09);
  --bad:#F0705A;
  --bad-fill:rgba(240,112,90,.13);
  --ghost:#5C6971;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.32);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1220px;margin:0 auto;padding:38px 22px 90px;display:flex;flex-direction:column;gap:30px}

.masthead{
  display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:14px;
}
.masthead h1{
  margin:0;font-size:clamp(30px,4.6vw,50px);font-weight:700;letter-spacing:-.024em;line-height:.98;
  text-wrap:balance;
}
.stamp{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;line-height:1.65;
  color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;
}
.stamp b{color:var(--ink2);font-weight:600}
.stamp .k{color:var(--ghost);letter-spacing:.13em}

.fig{
  background:var(--panel);border:1px solid var(--hair);border-radius:3px;
  padding:20px 20px 22px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:14px;margin:0;
}
.figtitle{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  border-bottom:1px solid var(--hair2);padding-bottom:10px;
}
.figtitle .n{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;font-weight:600;
  color:var(--muted);letter-spacing:.10em;
}
.figtitle h2{
  margin:0;font-size:15px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink);
}
.figbody{overflow-x:auto}
svg{display:block;width:100%;height:auto;min-width:640px}

/* --- svg paint classes --- */
.pane{fill:var(--panel2);stroke:var(--hair);stroke-width:1}
.pane-live{fill:var(--live-fill);stroke:var(--live);stroke-width:2}
.pane-warn{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:9 7}
.pane-ghost{fill:none;stroke:var(--ghost);stroke-width:1.5;stroke-dasharray:2 6}
.chip{fill:var(--panel);stroke:var(--hair);stroke-width:1}
.chip-live{fill:var(--panel);stroke:var(--live);stroke-width:1.5}
.chip-dash{fill:none;stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 5}
.chip-bad{fill:var(--bad-fill);stroke:var(--bad);stroke-width:1.5}

.fL{fill:var(--live)} .fW{fill:var(--warn)} .fB{fill:var(--bad)}
.fI{fill:var(--ink)} .fM{fill:var(--muted)} .fG{fill:var(--ghost)} .fI2{fill:var(--ink2)}
.sL{stroke:var(--live);fill:none} .sW{stroke:var(--warn);fill:none}
.sB{stroke:var(--bad);fill:none} .sG{stroke:var(--ghost);fill:none}
.sH{stroke:var(--hair);fill:none} .sM{stroke:var(--muted);fill:none} .sI{stroke:var(--ink);fill:none}
.trk{fill:none;stroke:var(--hair);stroke-width:1.5}
.trkf{fill:var(--panel2);stroke:var(--hair);stroke-width:1}

text{font-family:"Archivo","Helvetica Neue",Arial,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lbl{font-size:12.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase}
.big{font-size:26px;font-weight:600;letter-spacing:-.02em}
.huge{font-size:38px;font-weight:700;letter-spacing:-.03em}
.name{font-size:30px;font-weight:700;letter-spacing:-.02em}
.sm{font-size:12.5px;font-weight:500}
.sm2{font-size:13px;font-weight:500}
.md{font-size:15px;font-weight:600}

.key{
  display:flex;gap:26px;flex-wrap:wrap;align-items:center;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;color:var(--muted);
  border-top:1px solid var(--hair);padding-top:14px;
}
.key span{display:inline-flex;align-items:center;gap:8px}
.key b{font-weight:500;color:var(--muted)}
.sw{width:26px;height:0;border-top-width:2px;border-top-style:solid;display:inline-block}
.sw.solid{border-color:var(--live)}
.sw.dash{border-color:var(--warn);border-top-style:dashed}
.sw.dot{border-color:var(--ghost);border-top-style:dotted}
.sw.brk{border-color:var(--bad);border-top-style:dashed}
</style>
